name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Tests compile at Java 17; the app itself at Java 8 (see pom.xml)
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  ui-test:
    # Teammates' browser scenarios (@ui): start the app, then drive headless Chrome against it
    name: UI tests (Cucumber @ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile everything first so the test run below doesn't rewrite target/ under the running app
      - name: Compile
        run: mvn -B test-compile

      - name: Start the app
        run: |
          nohup mvn -B jetty:run > jetty.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/kanban; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App did not start"; tail -100 jetty.log; exit 1

      - name: Run UI scenarios
        run: mvn -B test -Dtest=RunCucumberTest -Dcucumber.filter.tags=@ui -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload UI test reports and app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            target/surefire-reports/
            jetty.log
          if-no-files-found: ignore
